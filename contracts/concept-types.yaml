version: 1
concept_types:
  policy:
    type: Policy
    description: A rule people must follow, who it applies to, and its exceptions.
    authored: true
    structures: [policy]                       # one structure: no rule needed
    path: "knowledge/policies/{title}.md"
    tags: [policy, "{okfx_team}"]
    fields:
      okfx_team:
        description: The owning team's key.
        required: true
        from: teams — the team the document names as owner
    identity:
      fields: [title]
      guidance: >-
        One policy per subject. Titles match ignoring case, dates, version numbers and words like
        "policy", "update" or "2026" (the Remote Work Policy and "Remote work policy – 2026
        update" are one policy).

  runbook:
    type: Runbook
    description: How to carry out an operational task.
    authored: true
    structures: [routine-procedure, incident-response]
    # Several structures, so a rule says which one fits THIS document. Decided by content, per
    # document: two runbooks from the same team can get different structures.
    structure_rule: >-
      Use incident-response when the document is about responding to an outage, alert or other
      unplanned failure. Use routine-procedure for planned, repeatable work such as deployments,
      rotations or maintenance.
    path: "knowledge/runbooks/{title}.md"
    tags: [runbook, "{okfx_team}"]
    fields:
      okfx_team:
        description: The owning team's key.
        required: true
        from: teams — the team the document names as owner
      okfx_on_call:
        description: Where to escalate.
        from: teams — the owning team's on_call value
    identity:
      fields: [title, okfx_team]
      match: all
      guidance: >-
        The same task or incident for the same team. Titles match when they name the same system
        and situation, whatever the wording: "Primary Database Outage Response" and "Database
        Primary Outage Runbook" are one runbook; "Deploying the Web App" and "Rolling Back the Web
        App" are two.

  # A Pokédex, for testing Bookwyrm and Archivist on a bundle with real bulk: regions are the
  # subject areas, primary types the folders inside them, one concept per Pokémon.
  pokemon:
    type: Pokemon
    description: One Pokémon species (its default form) — types, base stats, matchups, abilities, size, evolution.
    authored: true
    structures: [pokemon-profile]
    path: "knowledge/{okfx_region}/{okfx_primary_type}/{title}.md"
    tags: [pokemon, "{okfx_region}"]
    fields:
      okfx_region:
        description: The region it was first found in, lower case (kanto, johto, hoenn, sinnoh, unova, kalos, alola, galar, paldea).
        required: true
        from: the generation the source gives — each generation's main region
      okfx_dex_number:
        description: Its National Pokédex number.
        required: true
        from: the source's National Pokédex number
      okfx_types:
        description: Its types, primary first, lower case.
        required: true
        from: the source's types, in slot order
      okfx_primary_type:
        description: Its first type, lower case; the folder it lives in.
        required: true
        from: the first of okfx_types
      okfx_generation:
        description: The generation it was introduced in, as a number.
        from: the source's generation
    identity:
      fields: [okfx_dex_number]
      guidance: One concept per National Pokédex number; regional forms belong to the same species.

  region-overview:
    type: Region Overview
    description: A region as a subject area — the Pokémon first found there, grouped by primary type.
    authored: true
    structures: [region-overview]
    path: "knowledge/{okfx_region}/{title}.md"
    tags: [region-overview, "{okfx_region}"]
    fields:
      okfx_region:
        description: The region, lower case.
        required: true
        from: the region the source covers
      okfx_generation:
        description: The region's generation, as a number.
        from: the source's generation
    identity:
      fields: [okfx_region]

  # The balls trainers throw to catch Pokémon: one concept per ball type, in one flat folder.
  poke-ball:
    type: Poke Ball
    description: One kind of Poké Ball — what it does, how well it catches, and how to get it.
    authored: true
    structures: [poke-ball-profile]            # one structure: no rule needed
    path: "knowledge/poke-balls/{title}.md"
    tags: [poke-ball, items]
    identity:
      fields: [title]
      guidance: One concept per ball type. Titles match ignoring case and accents ("Poke Ball" and "Poké Ball" are one ball); a Great Ball and an Ultra Ball are two.
